historias:
  HU-001: {nombre: Registrar usuario con rol y consentimiento de datos, rf: RF-001, enunciado: "Como visitante, quiero crear una cuenta eligiendo si seré productor o comprador (consumidor o negocio) y aceptar el tratamiento de mis datos, para empezar a vender o comprar en AgroConecta."}
  HU-002: {nombre: Iniciar y renovar sesión, rf: RF-002, enunciado: "Como usuario registrado, quiero iniciar sesión y mantener mi acceso de forma segura, para consultar y utilizar las funciones correspondientes a mi rol sin tener que ingresar mis credenciales en cada visita."}
  HU-003: {nombre: Eliminar cuenta, rf: RF-003, enunciado: "Como usuario, quiero solicitar y confirmar la eliminación de mi cuenta, para dejar de usar AgroConecta y ejercer mi derecho de supresión de datos personales."}
  HU-004: {nombre: Gestionar perfil de productor, rf: RF-004, enunciado: "Como productor, quiero completar la información de mi finca, mi documento y mi municipio, para enviar mi perfil a revisión y poder vender cuando sea verificado."}
  HU-005: {nombre: Configurar opciones de entrega, rf: RF-005, enunciado: "Como productor, quiero configurar si ofrezco entrega a domicilio (con sus zonas y costos), recogida en mi finca, o ambas opciones, para que cada comprador pueda elegir cómo recibir su pedido."}
  HU-006: {nombre: Verificar productor, rf: RF-006, enunciado: "Como administrador, quiero revisar la información de cada productor y aprobar o rechazar su solicitud de verificación, para permitir que solo productores validados publiquen y vendan."}
  HU-007: {nombre: Gestionar productos, rf: RF-007, enunciado: "Como productor verificado, quiero publicar, editar y desactivar mis productos indicando descripción, unidad, precio, existencias e imágenes, para mantener actualizada mi oferta para los compradores."}
  HU-008: {nombre: Definir precios por volumen, rf: RF-008, enunciado: "Como productor, quiero establecer precios unitarios especiales a partir de determinadas cantidades, para ofrecer mejores condiciones a los negocios y a quienes compran por volumen."}
  HU-009: {nombre: "Buscar productos por texto, categoría y ubicación", rf: RF-009, enunciado: "Como comprador o visitante, quiero buscar productos por nombre, categoría, departamento y municipio, para encontrar fácilmente la oferta disponible en mi zona."}
  HU-010: {nombre: Ver detalle de producto y productor, rf: RF-010, enunciado: "Como comprador o visitante, quiero consultar la información, el precio, la disponibilidad y las condiciones de un producto, junto con el perfil y la calificación de quien lo vende, para decidir si me conviene comprarlo."}
  HU-011: {nombre: Gestionar carrito, rf: RF-011, enunciado: "Como comprador, quiero agregar productos al carrito, cambiar sus cantidades y quitarlos, para revisar y preparar mi compra antes de confirmarla."}
  HU-012: {nombre: Generar pedidos desde el carrito, rf: RF-012, enunciado: "Como comprador, quiero confirmar mi carrito y elegir la modalidad de entrega para cada productor, para generar un pedido independiente por productor, conservar los precios acordados y realizar un solo pago por la compra."}
  HU-013: {nombre: Aceptar o rechazar pedido, rf: RF-013, enunciado: "Como productor, quiero aceptar o rechazar cada pedido que ya fue pagado, para confirmar que puedo atenderlo o evitar comprometerme con una venta que no puedo cumplir."}
  HU-014: {nombre: Marcar pedido como enviado, rf: RF-014, enunciado: "Como productor, quiero marcar un pedido aceptado como despachado o listo para recoger, para que el comprador conozca que el pedido ya está en camino o disponible para su recogida."}
  HU-015: {nombre: Confirmar recepción del pedido, rf: RF-015, enunciado: "Como comprador, quiero confirmar que recibí mi pedido, para cerrar la compra y permitir que se calcule y acredite el saldo correspondiente al productor."}
  HU-016: {nombre: Consultar pedidos e historial, rf: RF-016, enunciado: "Como comprador o productor, quiero consultar mis pedidos, sus estados y sus fechas, para hacer seguimiento a mis compras o ventas desde un solo lugar."}
  HU-017: {nombre: Actualizar pedidos automáticamente según sus plazos, rf: RF-017, enunciado: "Como comprador o productor, quiero que el sistema actualice automáticamente los pedidos que superen los plazos establecidos y me informe de esos cambios, para evitar que una compra o venta quede detenida sin resolución."}
  HU-018: {nombre: Iniciar pago en línea, rf: RF-018, enunciado: "Como comprador, quiero pagar mi compra en línea mediante tarjeta, PSE o Nequi, para completar el pedido de forma sencilla sin utilizar efectivo."}
  HU-019: {nombre: Actualizar el estado del pedido tras el pago, rf: RF-019, enunciado: "Como comprador, quiero ver actualizado el estado de mis pedidos cuando Wompi confirme o rechace el pago, para saber si la compra quedó pagada y el productor ya puede atenderla."}
  HU-020: {nombre: Calcular comisión y acreditar saldo, rf: RF-020, enunciado: "Como productor, quiero que al entregarse un pedido se calcule automáticamente la comisión y se acredite en mi saldo el valor que me corresponde, incluido el costo de envío, para conocer cuánto he ganado por esa venta."}
  HU-021: {nombre: Consultar saldo y movimientos, rf: RF-021, enunciado: "Como productor, quiero consultar mi saldo disponible y el detalle de sus movimientos, para saber cuánto dinero tengo y cuánto puedo solicitar en retiro."}
  HU-022: {nombre: Solicitar liquidación de saldo, rf: RF-022, enunciado: "Como productor, quiero solicitar el retiro de una parte o de todo mi saldo disponible, respetando el mínimo configurado, para recibir el dinero de mis ventas."}
  HU-023: {nombre: Procesar el reembolso total, rf: RF-023, enunciado: "Como comprador, quiero recibir el reembolso total de un pedido cuando el productor lo rechace o una disputa se resuelva a mi favor, para recuperar el dinero que pagué."}
  HU-024: {nombre: Calificar productor, rf: RF-024, enunciado: "Como comprador, quiero calificar al productor después de recibir mi pedido, para compartir mi experiencia y ayudar a otros compradores a elegir."}
  HU-025: {nombre: Abrir disputa, rf: RF-025, enunciado: "Como comprador, quiero reportar un problema de un pedido que aparece como enviado, adjuntando el motivo y la evidencia, para que el administrador lo revise antes de liberar el pago al productor."}
  HU-026: {nombre: Resolver disputa, rf: RF-026, enunciado: "Como administrador, quiero revisar la información y las evidencias de una disputa y decidir si se resuelve a favor del comprador o del productor, para cerrar el pedido y aplicar el resultado correspondiente."}
  HU-027: {nombre: Marcar liquidación como pagada, rf: RF-027, enunciado: "Como administrador, quiero registrar que una liquidación solicitada ya fue transferida al productor, para dejar constancia del pago y actualizar su estado."}
  HU-028: {nombre: Configurar comisión y mínimo de retiro, rf: RF-028, enunciado: "Como administrador, quiero configurar el porcentaje de comisión y el monto mínimo que puede retirar un productor, para administrar las condiciones económicas de la plataforma."}
  HU-029: {nombre: Consultar reportes de pedidos y comisiones, rf: RF-029, enunciado: "Como administrador, quiero consultar los pedidos agrupados por estado y las comisiones generadas por mes, para hacer seguimiento a la operación de AgroConecta."}
  HU-030: {nombre: Enviar notificaciones en la app y por correo, rf: RF-030, enunciado: "Como comprador o productor, quiero recibir avisos dentro de la aplicación y por correo sobre los cambios de mis pedidos, la verificación de mi perfil y mis liquidaciones, para estar informado oportunamente."}

reglas:
  RN-001: {nombre: Solo productores verificados venden, texto: Solo los productores con estado VERIFICADO pueden publicar o activar productos.}
  RN-002: {nombre: Un pedido por productor, texto: Un pedido contiene productos de un único productor.}
  RN-003: {nombre: Precio congelado y precio por volumen, texto: "El precio unitario de cada ítem se congela al crear el pedido. Si la cantidad alcanza un umbral de precio por volumen, se aplica el precio del umbral más alto alcanzado."}
  RN-004: {nombre: Descuento y restitución de stock, texto: "El stock se descuenta al pasar a PAGADO y se restituye si un pedido que estuvo PAGADO termina en REEMBOLSADO. El stock no se reserva al crear el pedido: si al llegar el pago aprobado ya no alcanza, ese pedido pasa directamente a REEMBOLSADO (sin descontar stock) y los demás pedidos del mismo cobro siguen su curso."}
  RN-005: {nombre: Dinero retenido hasta la entrega, texto: El dinero de un pedido pagado queda retenido hasta que el pedido pasa a ENTREGADO.}
  RN-006: {nombre: Cálculo de comisión y crédito, texto: "Al pasar a ENTREGADO: comisión = redondeo(subtotal × porcentaje de comisión); se acredita al productor subtotal − comisión + costo de envío."}
  RN-007: {nombre: Porcentaje de comisión configurable, texto: El porcentaje de comisión lo configura el administrador (por defecto 8 %). Cada pedido guarda el porcentaje vigente cuando se creó.}
  RN-008: {nombre: Costo de envío, texto: "El costo de envío lo define el productor según su zona o modalidad, se cobra con el pedido y no paga comisión. La recogida tiene costo 0."}
  RN-009: {nombre: Saldo calculado por movimientos, texto: El saldo disponible del productor es la suma de sus movimientos de saldo; nunca se guarda como un valor editable.}
  RN-010: {nombre: Solicitud de liquidación, texto: "El productor puede solicitar una liquidación por un monto menor o igual a su saldo disponible y mayor o igual al mínimo configurado. La solicitud crea un movimiento RETIRO; el administrador la marca PAGADA después de transferir por fuera."}
  RN-011: {nombre: Reembolso total, texto: "El reembolso es siempre total (subtotal + envío) y se ejecuta mediante la pasarela (simulado en sandbox)."}
  RN-012: {nombre: Montos enteros en COP, texto: Los montos se manejan en pesos colombianos (COP) como enteros. Nunca se usan números flotantes para dinero.}
  RN-013: {nombre: Webhook idempotente y firmado, texto: El webhook es idempotente (se registra el id de cada evento procesado) y se verifica su firma antes de procesarlo.}
  RN-014: {nombre: Calificación única tras la entrega, texto: "Solo se puede calificar un pedido ENTREGADO, una vez, y solo lo puede hacer su comprador (1 a 5 estrellas y comentario opcional)."}
  RN-015: {nombre: Disputa solo sobre pedidos enviados, texto: "Solo se puede abrir disputa sobre un pedido en estado ENVIADO, y solo lo puede hacer su comprador."}
  RN-016: {nombre: Plazos automáticos del pedido, texto: "Un pedido PENDIENTE_PAGO se cancela tras 30 minutos sin pago; un pedido PAGADO se reembolsa si el productor no responde en 48 horas; y un pedido ENVIADO pasa a ENTREGADO tras 7 días sin confirmación ni disputa. El planificador revisa estos plazos cada 5 minutos y aplica los cambios de forma idempotente."}

rnf:
  RNF-001: {categoria: Seguridad, requisito: Las contraseñas se almacenan con bcrypt.}
  RNF-002: {categoria: Seguridad, requisito: El token de acceso dura 15 minutos y se renueva con un refresh token.}
  RNF-003: {categoria: Seguridad, requisito: "5 intentos fallidos de inicio de sesión bloquean la cuenta 15 minutos (valor propuesto)."}
  RNF-004: {categoria: Seguridad, requisito: Todos los endpoints aplican autorización por rol y por propiedad del recurso.}
  RNF-005: {categoria: Seguridad, requisito: Todos los endpoints validan la entrada; una entrada inválida responde 400.}
  RNF-006: {categoria: Integridad, requisito: "Las operaciones de dinero (pago aprobado, pedido entregado, reembolso, solicitud de liquidación) se ejecutan cada una en una sola transacción de base de datos."}
  RNF-007: {categoria: Fiabilidad, requisito: El webhook de pagos es idempotente y verifica la firma de cada evento.}
  RNF-008: {categoria: Fiabilidad, requisito: "Un job programado aplica los plazos automáticos cada 5 minutos y es idempotente."}
  RNF-009: {categoria: Portabilidad y usabilidad, requisito: "La aplicación es una PWA instalable y usable desde 360 px de ancho."}
  RNF-010: {categoria: Cumplimiento, requisito: "Cumple la Ley 1581 de 2012: consentimiento explícito al registrarse y opción de eliminar la cuenta."}
  RNF-011: {categoria: Mantenibilidad, requisito: "El backend sigue Clean Architecture: la capa domain no depende de librerías externas."}
  RNF-012: {categoria: Calidad, requisito: "Cada pull request ejecuta en CI lint, pruebas y build; el camino principal tiene prueba E2E."}
  RNF-013: {categoria: Rendimiento, requisito: "La búsqueda de catálogo responde con p95 ≤ 1 s con 1.000 productos (valor propuesto)."}
  RNF-014: {categoria: Interoperabilidad, requisito: "Los errores responden con la forma {codigo, mensaje, detalles?} y los códigos HTTP 400, 403, 404, 409 y 422 según su tipo."}

