historias:
  HU-001: {nombre: Registrar usuario con rol y consentimiento de datos, rf: RF-001, enunciado: "Como visitante, quiero registrarme como productor o comprador (consumidor o negocio) aceptando el tratamiento de mis datos, para poder vender o comprar en la plataforma."}
  HU-002: {nombre: Iniciar y renovar sesión, rf: RF-002, enunciado: "Como usuario registrado, quiero iniciar sesión y mantenerla activa de forma segura, para usar las funciones de mi rol sin volver a ingresar mis datos a cada momento."}
  HU-003: {nombre: Eliminar cuenta, rf: RF-003, enunciado: "Como usuario, quiero eliminar mi cuenta, para ejercer mi derecho de supresión de datos personales."}
  HU-004: {nombre: Gestionar perfil de productor, rf: RF-004, enunciado: "Como productor, quiero registrar los datos de mi finca, mi documento y mi municipio, para solicitar la verificación y poder vender."}
  HU-005: {nombre: Configurar opciones de entrega, rf: RF-005, enunciado: "Como productor, quiero indicar si entrego a domicilio (zona y costo), si el comprador recoge, o ambas, para que el comprador sepa cómo recibirá su pedido."}
  HU-006: {nombre: Verificar productor, rf: RF-006, enunciado: "Como administrador, quiero aprobar o rechazar la verificación de un productor, para que solo productores reales publiquen productos."}
  HU-007: {nombre: Gestionar productos, rf: RF-007, enunciado: "Como productor verificado, quiero publicar, editar y desactivar productos con precio, unidad, stock e imágenes, para ofrecerlos a los compradores."}
  HU-008: {nombre: Definir precios por volumen, rf: RF-008, enunciado: "Como productor, quiero definir precios más bajos a partir de ciertas cantidades, para atraer compras grandes de negocios."}
  HU-009: {nombre: "Buscar productos por texto, categoría y ubicación", rf: RF-009, enunciado: "Como comprador o visitante, quiero buscar productos por nombre, categoría, departamento y municipio, para encontrar productores cercanos."}
  HU-010: {nombre: Ver detalle de producto y productor, rf: RF-010, enunciado: "Como comprador o visitante, quiero ver el detalle de un producto y la información y calificación de su productor, para decidir si compro."}
  HU-011: {nombre: Gestionar carrito, rf: RF-011, enunciado: "Como comprador, quiero agregar, cambiar y quitar productos de mi carrito, para preparar mi compra."}
  HU-012: {nombre: Generar pedidos desde el carrito, rf: RF-012, enunciado: "Como comprador, quiero confirmar mi carrito eligiendo la modalidad de entrega, para que se generen los pedidos a cada productor con precios congelados."}
  HU-013: {nombre: Aceptar o rechazar pedido, rf: RF-013, enunciado: "Como productor, quiero aceptar o rechazar un pedido pagado, para comprometerme solo con lo que puedo cumplir."}
  HU-014: {nombre: Marcar pedido como enviado, rf: RF-014, enunciado: "Como productor, quiero marcar un pedido como despachado o listo para recoger, para que el comprador sepa que va en camino."}
  HU-015: {nombre: Confirmar recepción del pedido, rf: RF-015, enunciado: "Como comprador, quiero confirmar que recibí mi pedido, para que se libere el pago al productor."}
  HU-016: {nombre: Consultar pedidos e historial, rf: RF-016, enunciado: "Como usuario, quiero consultar mis pedidos y su estado, para hacer seguimiento a mis compras o ventas."}
  HU-017: {nombre: Aplicar plazos automáticos del pedido, rf: RF-017, enunciado: "Como comprador, quiero que un pedido sin pago se cancele a los 30 min, que un pedido sin respuesta del productor se reembolse a las 48 h y que uno enviado se dé por entregado a los 7 días, para que ningún pedido quede detenido."}
  HU-018: {nombre: Iniciar pago en línea, rf: RF-018, enunciado: "Como comprador, quiero pagar mis pedidos en línea con tarjeta, PSE o Nequi, para completar la compra sin efectivo."}
  HU-019: {nombre: Procesar notificación de pago (webhook), rf: RF-019, enunciado: "Como comprador, quiero que mis pedidos pasen a pagado en cuanto la pasarela apruebe el pago, para que el productor pueda atenderlos."}
  HU-020: {nombre: Calcular comisión y acreditar saldo, rf: RF-020, enunciado: "Como productor, quiero que al entregarse un pedido se me acredite el subtotal menos la comisión, más el envío, para disponer de mi dinero."}
  HU-021: {nombre: Consultar saldo y movimientos, rf: RF-021, enunciado: "Como productor, quiero ver mi saldo disponible y sus movimientos, para saber cuánto puedo retirar."}
  HU-022: {nombre: Solicitar liquidación de saldo, rf: RF-022, enunciado: "Como productor, quiero solicitar el retiro de mi saldo disponible, para recibir el dinero de mis ventas."}
  HU-023: {nombre: Ejecutar reembolso, rf: RF-023, enunciado: "Como comprador, quiero recibir el reembolso total cuando mi pedido es rechazado o la disputa se resuelve a mi favor, para no perder mi dinero."}
  HU-024: {nombre: Calificar productor, rf: RF-024, enunciado: "Como comprador, quiero calificar al productor después de recibir mi pedido, para orientar a otros compradores."}
  HU-025: {nombre: Abrir disputa, rf: RF-025, enunciado: "Como comprador, quiero abrir una disputa sobre un pedido enviado con problemas, para que el administrador la revise antes de liberar el pago."}
  HU-026: {nombre: Resolver disputa, rf: RF-026, enunciado: "Como administrador, quiero resolver una disputa a favor del productor o del comprador, para cerrar el pedido de forma justa."}
  HU-027: {nombre: Marcar liquidación como pagada, rf: RF-027, enunciado: "Como administrador, quiero marcar una liquidación como pagada después de transferir, para dejar registro del pago al productor."}
  HU-028: {nombre: Configurar comisión y mínimo de retiro, rf: RF-028, enunciado: "Como administrador, quiero configurar el porcentaje de comisión y el monto mínimo de retiro, para ajustar el modelo de negocio."}
  HU-029: {nombre: Consultar reportes de pedidos y comisiones, rf: RF-029, enunciado: "Como administrador, quiero ver los totales de pedidos por estado y las comisiones por mes, para seguir la operación."}
  HU-030: {nombre: Enviar notificaciones en la app y por correo, rf: RF-030, enunciado: "Como usuario, quiero recibir avisos en la app y por correo sobre mis pedidos, mi verificación y mis liquidaciones, para enterarme a tiempo."}

reglas:
  RN-001: {nombre: Solo productores verificados venden, texto: Solo los productores con estado VERIFICADO pueden publicar o activar productos.}
  RN-002: {nombre: Un pedido por productor, texto: Un pedido contiene productos de un único productor.}
  RN-003: {nombre: Precio congelado y precio por volumen, texto: "El precio unitario de cada ítem se congela al crear el pedido. Si la cantidad alcanza un umbral de precio por volumen, se aplica el precio del umbral más alto alcanzado."}
  RN-004: {nombre: Descuento y restitución de stock, texto: "El stock se descuenta al pasar a PAGADO y se restituye si un pedido que estuvo PAGADO termina en REEMBOLSADO. El stock no se reserva al crear el pedido: si al llegar el pago aprobado ya no alcanza, ese pedido pasa directamente a REEMBOLSADO (sin descontar stock) y los demás pedidos del mismo cobro siguen su curso."}
  RN-005: {nombre: Dinero retenido hasta la entrega, texto: El dinero de un pedido pagado queda retenido hasta que el pedido pasa a ENTREGADO.}
  RN-006: {nombre: Cálculo de comisión y crédito, texto: "Al pasar a ENTREGADO: comisión = redondeo(subtotal × porcentaje de comisión); se acredita al productor subtotal − comisión + costo de envío."}
  RN-007: {nombre: Porcentaje de comisión configurable, texto: El porcentaje de comisión lo configura el administrador (por defecto 8 %). Cada pedido guarda el porcentaje vigente cuando se creó.}
  RN-008: {nombre: Costo de envío, texto: "El costo de envío lo define el productor según su zona o modalidad, se cobra con el pedido y no paga comisión. La recogida tiene costo 0."}
  RN-009: {nombre: Saldo calculado por movimientos, texto: El saldo disponible del productor es la suma de sus movimientos de saldo; nunca se guarda como un valor editable.}
  RN-010: {nombre: Solicitud de liquidación, texto: "El productor puede solicitar una liquidación por un monto menor o igual a su saldo disponible y mayor o igual al mínimo configurado. La solicitud crea un movimiento RETIRO; el administrador la marca PAGADA después de transferir por fuera."}
  RN-011: {nombre: Reembolso total, texto: "El reembolso es siempre total (subtotal + envío) y se ejecuta mediante la pasarela (simulado en sandbox)."}
  RN-012: {nombre: Montos enteros en COP, texto: Los montos se manejan en pesos colombianos (COP) como enteros. Nunca se usan números flotantes para dinero.}
  RN-013: {nombre: Webhook idempotente y firmado, texto: El webhook es idempotente (se registra el id de cada evento procesado) y se verifica su firma antes de procesarlo.}
  RN-014: {nombre: Calificación única tras la entrega, texto: "Solo se puede calificar un pedido ENTREGADO, una vez, y solo lo puede hacer su comprador (1 a 5 estrellas y comentario opcional)."}
  RN-015: {nombre: Disputa solo sobre pedidos enviados, texto: "Solo se puede abrir disputa sobre un pedido en estado ENVIADO, y solo lo puede hacer su comprador."}

rnf:
  RNF-001: {categoria: Seguridad, requisito: Las contraseñas se almacenan con bcrypt.}
  RNF-002: {categoria: Seguridad, requisito: El token de acceso dura 15 minutos y se renueva con un refresh token.}
  RNF-003: {categoria: Seguridad, requisito: "5 intentos fallidos de inicio de sesión bloquean la cuenta 15 minutos (valor propuesto)."}
  RNF-004: {categoria: Seguridad, requisito: Todos los endpoints aplican autorización por rol y por propiedad del recurso.}
  RNF-005: {categoria: Seguridad, requisito: Todos los endpoints validan la entrada; una entrada inválida responde 400.}
  RNF-006: {categoria: Integridad, requisito: "Las operaciones de dinero (pago aprobado, pedido entregado, reembolso, solicitud de liquidación) se ejecutan cada una en una sola transacción de base de datos."}
  RNF-007: {categoria: Fiabilidad, requisito: El webhook de pagos es idempotente y verifica la firma de cada evento.}
  RNF-008: {categoria: Fiabilidad, requisito: "Un job programado aplica los plazos automáticos cada 5 minutos y es idempotente."}
  RNF-009: {categoria: Portabilidad y usabilidad, requisito: "La aplicación es una PWA instalable y usable desde 360 px de ancho."}
  RNF-010: {categoria: Cumplimiento, requisito: "Cumple la Ley 1581 de 2012: consentimiento explícito al registrarse y opción de eliminar la cuenta."}
  RNF-011: {categoria: Mantenibilidad, requisito: "El backend sigue Clean Architecture: la capa domain no depende de librerías externas."}
  RNF-012: {categoria: Calidad, requisito: "Cada pull request ejecuta en CI lint, pruebas y build; el camino principal tiene prueba E2E."}
  RNF-013: {categoria: Rendimiento, requisito: "La búsqueda de catálogo responde con p95 ≤ 1 s con 1.000 productos (valor propuesto)."}
  RNF-014: {categoria: Interoperabilidad, requisito: "Los errores responden con la forma {codigo, mensaje, detalles?} y los códigos HTTP 400, 403, 404, 409 y 422 según su tipo."}

