# Catálogo maestro de IDs de AgroConecta. Fuente única de nombres para los 4 documentos.
# Origen: docs/diseno/specs/2026-11-10-agroconecta-design.md

objetivo_general: >-
  Desarrollar, a junio de 2027, una plataforma web instalable (PWA) que permita a pequeños
  productores agrícolas de Colombia vender directamente a consumidores y negocios, con pedidos
  y pago en línea, para reducir su dependencia de intermediarios.

objetivos:
  OBJ-01: Documentar la formulación, la gestión, los requisitos y el backlog del producto a 2026-12-04
  OBJ-02: Implementar el registro, la verificación de productores y el catálogo de productos con búsqueda por ubicación
  OBJ-03: Implementar pedidos con pago en línea (sandbox), retención del dinero, comisión y liquidación al productor
  OBJ-04: Implementar el seguimiento del pedido, las disputas y las calificaciones
  OBJ-05: Verificar el MVP con pruebas automatizadas y desplegarlo a 2027-06-11

indicadores:
  IND-01: {nombre: Documentos SENA entregados, objetivo: OBJ-01, meta: 4 de 4 a 2026-12-04}
  IND-02: {nombre: RF del MVP implementados y aceptados, objetivo: "OBJ-02, OBJ-03, OBJ-04", meta: 100 % (30 de 30)}
  IND-03: {nombre: Reglas de negocio con prueba unitaria automatizada, objetivo: OBJ-03, meta: 15 de 15}
  IND-04: {nombre: Camino principal E2E pasando en CI sobre la rama principal, objetivo: OBJ-05, meta: 100 % de las ejecuciones en la semana de entrega}

interesados:
  STK-01: Pequeños productores agrícolas
  STK-02: Compradores consumidores
  STK-03: Compradores negocio (restaurantes, tiendas, fruvers)
  STK-04: Administrador de la plataforma
  STK-05: Instructor(es) SENA
  STK-06: Equipo de desarrollo
  STK-07: Wompi (proveedor externo)

