      - ["Pedido", "Compra a un único productor generada desde el carrito, con su propia máquina de estados (RN-002)."]
      - ["Saldo retenido", "Dinero de un pedido pagado que aún no se entrega; no pertenece todavía al productor (RN-005)."]
      - ["Saldo disponible", "Suma de los movimientos de saldo del productor; es lo que puede retirar (RN-009)."]
      - ["Liquidación", "Retiro de saldo disponible solicitado por el productor y marcado como pagado por el administrador (RN-010)."]
