      - 20:
          campos:
            "ID y nombre": "{{rf.RF-012}}"
            "Descripción": "El sistema debe convertir el carrito confirmado en un pedido por cada productor, con los precios congelados, el costo de envío y el porcentaje de comisión vigente, y un único cobro."
            "Fuente": "STK-02, STK-03 / OBJ-03"
            "Justificación": "Es el paso que convierte la intención de compra en pedidos que cada productor puede atender (RN-002)."
            "Actor principal": "ACT-02, ACT-03"
            "Precondiciones": "Comprador con sesión iniciada; carrito con al menos un producto activo de productores verificados."
            "Disparador": "El comprador confirma el carrito y elige la modalidad de entrega."
            "Entradas": "Ítems del carrito, modalidad de entrega y dirección (si es domicilio)."
            "Procesamiento / comportamiento": "Agrupa los ítems por productor; congela el precio unitario aplicando el precio por volumen alcanzado (RN-003); calcula subtotal y envío (RN-008); guarda el porcentaje de comisión vigente (RN-007); crea un Pago que cubre todos los pedidos."
            "Salidas": "N pedidos en PENDIENTE_PAGO y la referencia del cobro para iniciar el pago (RF-018)."
            "Postcondiciones": "El carrito queda vacío; el stock no se descuenta todavía (RN-004)."
            "Excepciones": "Producto inactivo o de productor no verificado → 422; carrito vacío → 422."
            "Reglas de negocio asociadas": "RN-002, RN-003, RN-007, RN-008, RN-012"
            "Dependencias": "RF-011, RF-005, RF-018"
            "Prioridad": "Must"
            "Versión objetivo": "MVP"
            "Criterios de aceptación": "Ver escenarios de RF-012 en la sección 5.4."
            "Método de verificación": "Prueba unitaria (división del carrito y precio por volumen) y prueba E2E."
            "Responsable de validación": "EQ-04 (Product Owner)"
            "Estado": "Aprobado"
      - 20:
          campos:
            "ID y nombre": "{{rf.RF-019}}"
            "Descripción": "El sistema debe procesar las notificaciones de la pasarela de pagos y actualizar los pedidos del cobro según el resultado."
            "Fuente": "STK-07 / OBJ-03"
            "Justificación": "Confirma el pago sin depender del navegador del comprador; sostiene la retención del dinero (RN-005)."
            "Actor principal": "ACT-06"
            "Precondiciones": "Existe un Pago con pedidos en PENDIENTE_PAGO."
            "Disparador": "Wompi envía un evento al endpoint del webhook."
            "Entradas": "Evento con id, referencia, estado de la transacción y firma."
            "Procesamiento / comportamiento": "Verifica la firma; si el id del evento ya fue procesado no hace nada (RN-013); si está APROBADA, en una transacción pasa cada pedido a PAGADO y descuenta su stock, o lo pasa a REEMBOLSADO si ya no hay stock (RN-004); si está rechazada, pasa los pedidos a CANCELADO."
            "Salidas": "Pedidos actualizados y evento registrado."
            "Postcondiciones": "El dinero de los pedidos PAGADO queda retenido (RN-005)."
            "Excepciones": "Firma inválida → se rechaza sin procesar; referencia desconocida → se registra y se ignora."
            "Reglas de negocio asociadas": "RN-004, RN-005, RN-013"
            "Dependencias": "RF-018, RF-023, INT-01"
            "Prioridad": "Must"
            "Versión objetivo": "MVP"
            "Criterios de aceptación": "Ver escenarios de RF-019 en la sección 5.4."
            "Método de verificación": "Prueba de integración del webhook (aprobado, duplicado, firma inválida, sin stock)."
            "Responsable de validación": "EQ-01"
            "Estado": "Aprobado"
      - 20:
          campos:
            "ID y nombre": "{{rf.RF-020}}"
            "Descripción": "El sistema debe calcular la comisión y acreditar el saldo del productor cuando un pedido pasa a ENTREGADO."
            "Fuente": "STK-01, STK-04 / OBJ-03"
            "Justificación": "Libera el dinero retenido al productor y registra el ingreso de la plataforma."
            "Actor principal": "ACT-07 (evento PedidoEntregado)"
            "Precondiciones": "Pedido en ENVIADO o EN_DISPUTA."
            "Disparador": "El pedido pasa a ENTREGADO (confirmación del comprador, plazo de 7 días o resolución de disputa)."
            "Entradas": "Subtotal, costo de envío y porcentaje de comisión guardado en el pedido."
            "Procesamiento / comportamiento": "comisión = redondeo(subtotal × porcentaje); crea un MovimientoSaldo CREDITO_PEDIDO por subtotal − comisión + envío, en la misma transacción que el cambio de estado (RNF-006)."
            "Salidas": "Movimiento de saldo y comisión registrados en el pedido."
            "Postcondiciones": "El saldo disponible del productor aumenta (RN-009)."
            "Excepciones": "Si el pedido ya tiene crédito registrado, no se acredita de nuevo."
            "Reglas de negocio asociadas": "RN-005, RN-006, RN-009, RN-012"
            "Dependencias": "RF-015, RF-017, RF-026"
            "Prioridad": "Must"
            "Versión objetivo": "MVP"
            "Criterios de aceptación": "Ver escenario de RF-020 en la sección 5.4."
            "Método de verificación": "Prueba unitaria del cálculo y prueba de integración de la transacción."
            "Responsable de validación": "EQ-01"
            "Estado": "Aprobado"

